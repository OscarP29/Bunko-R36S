[package]
name = "r36s-manager"
version = "0.4.0"
description = "Gestor de ROMs para consolas R36S"
authors = ["you"]
edition = "2021"

[lib]
name = "r36s_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zip = { version = "9.2.2", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Solo los tests crean archivos .7z.
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["compress"] }
